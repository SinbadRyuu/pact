<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trade Room signals · VT Impact (preview)</title>
    <link rel="stylesheet" href="dist/main.css" />
    <style>
      html, body { margin: 0; background: #07081a; color: #eef2ff; font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif }
      .pv { max-width: 1000px; margin: 0 auto; padding: 32px 16px 80px; display: grid; gap: 22px }
      .pv-h { margin: 12px 0 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #8a93b8 }
      .pv-list { display: grid; gap: 22px }
      #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; padding: 10px 16px; border-radius: 10px; background: #071c22; color: #3ee8ff; border: 1px solid #3ee8ff66; font: 600 14px/1.2 system-ui; transition: .25s; pointer-events: none }
      #toast[data-on="1"] { opacity: 1; transform: translate(-50%, 0) }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="dist/main.js"></script>
  </body>
</html>
